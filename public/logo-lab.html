<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanForge — Lab Logo</title>
<style>
@font-face{font-family:'Space Grotesk';src:url('/fonts/space-grotesk.woff2') format('woff2');font-weight:500 700;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--bg:#0c0c0d;--panel:#141414;--line:#242424;--ink:#e8e6e1;--dim:#8f8b84;--amber:#e8a33d;--amber-ink:#0c0c0d;--paper:#f2f1ee;--paperink:#1a1a19}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Space Grotesk',system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px}
h1 .tag{color:var(--amber)}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 22px}
.sub b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.card.picked{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.tile{display:flex;align-items:center;justify-content:center;gap:26px;background:#0c0c0d;border:1px solid var(--line);border-radius:4px;padding:22px 10px}
.tile.light{background:var(--paper);border-color:#d9d7d1}
.tile svg{display:block}
.sizes{display:flex;align-items:center;gap:14px;justify-content:center}
.meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.code{font:600 12px 'JetBrains Mono',monospace;color:var(--amber);letter-spacing:.04em}
.name{font-size:13px;color:var(--dim)}
.pick{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:7px 10px;font:600 12.5px 'Space Grotesk',sans-serif;cursor:pointer}
.card.picked .pick{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.pick:hover{border-color:var(--amber)}
.sect{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:34px 0 12px;border-top:1px solid var(--line);padding-top:16px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,12,13,.94);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.bar .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.lockup{display:flex;align-items:center;gap:10px}
.lockup .word{font-weight:700;font-size:19px;letter-spacing:-.02em}
.lockup .word span{color:var(--amber)}
.chosen{font:600 13px 'JetBrains Mono',monospace;color:var(--amber)}
.hint{color:var(--dim);font-size:12.5px;margin-left:auto}
@media(max-width:640px){.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>PlanForge <span class="tag">/ lab logo</span></h1>
  <p class="sub">Pilih satu kandidat — klik <b>Pilih</b>, lalu balas ke Her dengan <b>kode</b>-nya (mis. <b>L1</b> / <b>G2</b>). Semua kandidat diuji di 64&nbsp;px, 32&nbsp;px, dan 16&nbsp;px di latar gelap dan terang.</p>
  <div id="grid" class="grid"></div>
  <div class="sect">Hasil generator AI (Gemini)</div>
  <div id="gridG" class="grid"></div>
</div>
<div class="bar"><div class="in">
  <div class="lockup" id="lockup"></div>
  <span class="chosen" id="chosen">belum dipilih</span>
  <span class="hint">klik "Pilih" pada kartu mana pun</span>
</div></div>
<script>
'use strict';
const A = '#e8a33d', DK = '#0c0c0d';
const S = (inner) => `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="${A}">${inner}</svg>`;
const cands = [
 { code:'L1', name:'Anvil — landasan tempa', svg:S(`<path d="M6 11H24l5 2-5 2H6z"/><path d="M13.5 15h5l.8 6h-6.6z"/><path d="M8 21h16v4H8z"/>`) },
 { code:'L2', name:'Anvil + percikan', svg:S(`<path d="M6 12H24l5 2-5 2H6z"/><path d="M13.5 16h5l.8 5h-6.6z"/><path d="M8 21h16v4H8z"/><path d="M11 4l1.5 2L11 8 9.5 6z"/><path d="M16 2.5l1.5 2-1.5 2-1.5-2z"/><path d="M21 4l1.5 2L21 8l-1.5-2z"/>`) },
 { code:'L3', name:'Palu — kepala & gagang', svg:S(`<g transform="rotate(-45 16 16)"><rect x="13.8" y="4" width="4.4" height="25" rx="1"/><rect x="6.5" y="3" width="19" height="7.4" rx="1.6"/></g>`) },
 { code:'L4', name:'Tumpukan layer', svg:S(`<rect x="6" y="6" width="20" height="4.6" rx="1"/><rect x="6" y="13.6" width="20" height="4.6" rx="1"/><rect x="6" y="21.2" width="20" height="4.6" rx="1"/>`) },
 { code:'L5', name:'Prompt terminal', svg:S(`<path d="M9.5 8.5v4.6l4.6 2.9-4.6 2.9v4.6L20.5 16z"/><rect x="21" y="19.4" width="6" height="4.2"/>`) },
 { code:'L6', name:'Kilau / spark', svg:S(`<path d="M16 2.5l2.7 10.8L29.5 16l-10.8 2.7L16 29.5l-2.7-10.8L2.5 16l10.8-2.7z"/>`) },
 { code:'L7', name:'Cetak biru — lembar terlipat', svg:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="${A}"><path d="M7 6h12l6 6v14H7z" stroke-width="3"/><path d="M11 15h9M11 20h6" stroke-width="2.6"/></svg>` },
 { code:'L8', name:'Jangka gambar', svg:S(`<path d="M16 6.4L7 26.5h4.6L16 14.2l4.4 12.3H25z"/><circle cx="16" cy="6" r="2.6"/>`) },
 { code:'L9', name:'Dokumen + centang', svg:`<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="${A}"><path d="M8 5h10l6 6v16H8z" stroke-width="3"/><path d="M11.5 18.5l3.4 3.4 6.4-7.6" stroke-width="3.2"/></svg>` },
 { code:'L10', name:'Nyala tempa', svg:S(`<path d="M16 3.5c1.2 5.4 7.6 7.4 7.6 13.4a7.6 7.6 0 0 1-15.2 0c0-4.2 3-6.6 5.2-9.6.5 2.2 1.1 3.3 2.1 4.4.9-3.2.3-5.6.3-8.2z"/>`) },
 { code:'L11', name:'Mur + centang (hardware)', svg:S(`<path d="M16 3l11.3 6.5v13L16 29 4.7 22.5v-13z"/><path d="M11.2 16.2l3.5 3.5 6.4-7.4" stroke="${DK}" stroke-width="3" fill="none"/>`) },
];
const gs = [
 { code:'G1', name:'Gemini — monogram PF', src:'/logos/g1-pf-monogram.png' },
 { code:'G2', name:'Gemini — palu garis tebal', src:'/logos/g2-hammer.png' },
 { code:'G3', name:'Gemini — monogram potong', src:'/logos/g3-monogram.png' },
];
const sizesOf = (svg) => `<div class="tile">${svg.replace('<svg', '<svg width="64" height="64"')}${svg.replace('<svg', '<svg width="32" height="32"')}${svg.replace('<svg', '<svg width="16" height="16"')}</div>`;
let picked = localStorage.getItem('pf-logo') || '';
function render(){
  document.getElementById('grid').innerHTML = cands.map(c => `
    <div class="card ${picked===c.code?'picked':''}" data-code="${c.code}">
      ${sizesOf(c.svg)}
      <div class="tile light">${c.svg.replace('<svg', '<svg width="48" height="48"')}</div>
      <div class="meta"><span class="code">${c.code}</span><span class="name">${c.name}</span></div>
      <button class="pick" data-pick="${c.code}">Pilih</button>
    </div>`).join('');
  document.getElementById('gridG').innerHTML = gs.map(c => `
    <div class="card ${picked===c.code?'picked':''}" data-code="${c.code}">
      <div class="tile"><img src="${c.src}" width="64" height="64" alt=""> <img src="${c.src}" width="32" height="32" alt=""> <img src="${c.src}" width="16" height="16" alt=""></div>
      <div class="meta"><span class="code">${c.code}</span><span class="name">${c.name}</span></div>
      <button class="pick" data-pick="${c.code}">Pilih</button>
    </div>`).join('');
  const chosen = [...cands, ...gs].find(x => x.code === picked);
  document.getElementById('chosen').textContent = picked ? `dipilih: ${picked} — ${chosen?.name || ''}` : 'belum dipilih';
  document.getElementById('lockup').innerHTML = chosen
    ? `${cands.find(c=>c.code===picked) ? sizesOfSmall(cands.find(c=>c.code===picked).svg) : `<img src="${gs.find(g=>g.code===picked).src}" width="28" height="28" alt="">`}<span class="word">Plan<span>Forge</span></span>`
    : `<span class="word">Plan<span>Forge</span></span>`;
}
function sizesOfSmall(svg){ return svg.replace('<svg', '<svg width="28" height="28"'); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  picked = b.dataset.pick; localStorage.setItem('pf-logo', picked); render();
  window.parent?.postMessage?.({ picked }, '*');
});
render();
</script>
</body>
</html>
